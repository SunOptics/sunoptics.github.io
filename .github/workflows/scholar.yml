name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch metrics from Google Scholar (via SerpAPI)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_NEW_FILE: ${{ runner.temp }}/scholar-new.json
        run: python3 tools/update_scholar.py

      - name: Open an issue for each new paper on Scholar
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ runner.temp }}/scholar-new.json
        run: |
          [ -s "$NEW" ] || exit 0
          # Any issue with the same title, open or closed, means already raised.
          existing=$(gh issue list --state all --limit 1000 --json title -q '.[].title')
          jq -c '.[]' "$NEW" | while read -r item; do
            title="New on Google Scholar: $(jq -r .title <<<"$item")"
            if grep -Fxq -- "$title" <<<"$existing"; then continue; fi
            gh issue create --title "$title" --body "$(jq -r .body <<<"$item")"
          done

      - name: Rebuild and publish if the metrics changed
        run: |
          if git diff --quiet -- data/cv.json; then
            echo "No change to publish."
            exit 0
          fi
          python3 tools/build.py
          python3 tools/check.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Google Scholar metrics"
          git push
